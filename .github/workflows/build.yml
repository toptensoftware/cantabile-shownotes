name: Build and Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build editor
        working-directory: editor
        run: npm run build

      - name: Get version
        id: version
        run: echo "value=$(node -p "require('./editor/package.json').version")" >> $GITHUB_OUTPUT

      - name: Zip dist
        run: cd editor/dist && zip -r ../../shownotes2.webfolder .

      - name: Delete existing latest release
        run: gh release delete latest --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        run: |
          gh release create latest shownotes2.webfolder \
            --title "v${{ steps.version.outputs.value }}" \
            --notes "Built from commit ${{ github.sha }}" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
